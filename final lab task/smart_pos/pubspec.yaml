name: smart_pos
description: A new Flutter project.

# Prevent accidental publishing to pub.dev
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.5.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # iOS-style icons
  cupertino_icons: ^1.0.8

  # Backend & Authentication
  supabase_flutter: ^2.3.4

  # Offline Storage (Compulsory)
  sqflite: ^2.4.0
  sqflite_common_ffi: ^2.3.3
  sqflite_common_ffi_web: ^0.4.5
  path: ^1.9.0

  # State Management
  provider: ^6.1.2

  # Google Drive Backup (Compulsory)
  google_sign_in: ^6.2.2
  googleapis: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Assets section (uncomment when needed)
  # assets:
  #   - assets/images/

  # Fonts section (uncomment when needed)
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: fonts/CustomFont-Regular.ttf
