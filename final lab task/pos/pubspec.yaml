name: pos
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.5.3


dependencies:
  flutter:
    sdk: flutter


  # Backend & Authentication
  supabase_flutter: ^2.3.4

  # Offline Storage (Compulsory)
  sqflite: ^2.4.0
  sqflite_common_ffi: ^2.3.3
  sqflite_common_ffi_web: ^0.4.5
  path: ^1.9.0

  # State Management
  provider: ^6.1.2

  # Google Drive Backup (Compulsory)
  google_sign_in: ^6.2.2
  googleapis: ^13.2.0



  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.0
  image_picker: ^1.1.2
  uuid: ^4.5.2
  intl: ^0.20.2
  fl_chart: ^0.71.0

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^4.0.0


flutter:


  # the material Icons class.
  uses-material-design: true



