name: mighty_news
description: MightyNews smart app with professional blog management features.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core
  intl: ^0.19.0
  cupertino_icons: ^1.0.6
  
  # Professional Features
  provider: ^6.1.1       # State Management
  google_fonts: ^6.1.0   # Fonts
  uuid: ^4.3.3           # Unique IDs
  image_picker: ^1.0.7   # Images
  share_plus: ^7.2.1     # Sharing
  
  # 🔴 THIS IS MISSING IN YOUR PROJECT:
  shared_preferences: ^2.2.2  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true